global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  
  - job_name: wikistream-producer
    metrics_path: /metrics
    static_configs:
      - targets: ["producer:9091"]
  
  - job_name: wikistream-consumer
    metrics_path: /metrics
    static_configs:
      - targets: ["consumer:7000"]