syntax = "proto3";

package recentchange.v1;

option go_package = "wikistream_project/internal/gen/recentchange/v1;recentchangev1";

message RecentChange {
    int64 id = 1;
    string type = 2;
    int32 namespace = 3;
    string title = 4;
    string user = 5;
    bool bot = 6;
    bool minor = 7;
    string server_url = 8;
    string server_name = 9;
    string wiki = 10;
    int64 timestamp = 11;
    string comment = 12;
}