apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: wikistream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: consumer
          image: docker.redpanda.com/redpandadata/connect:4.116.1
          args: ["run", "/connect/consumer.yaml"]
          envFrom:
            - configMapRef:
                name: wikistream-config
            - secretRef:
                name: wikistream-secrets
          ports:
            - name: http
              containerPort: 7000
          volumeMounts:
            - name: connect-config
              mountPath: /connect
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
      volumes:
        - name: connect-config
          configMap:
            name: consumer-connect-config
---
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: wikistream
spec:
  selector:
    app: consumer
  ports:
    - name: http
      port: 7000
      targetPort: http
