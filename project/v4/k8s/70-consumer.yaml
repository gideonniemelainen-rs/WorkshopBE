apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: wikistream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: consumer
          image: wikistream-consumer:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: wikistream-config
            - secretRef:
                name: wikistream-secrets
          ports:
            - name: http
              containerPort: 7000
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: consumer
  namespace: wikistream
spec:
  selector:
    app: consumer
  ports:
    - name: http
      port: 7000
      targetPort: http
