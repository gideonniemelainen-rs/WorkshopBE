apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: wikistream
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      terminationGracePeriodSeconds: 40
      containers:
        - name: producer
          image: wikistream-producer:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: wikistream-config
            - secretRef:
                name: wikistream-secrets
          ports:
            - name: metrics
              containerPort: 9091
          readinessProbe:
            httpGet:
              path: /status
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: producer
  namespace: wikistream
spec:
  selector:
    app: producer
  ports:
    - name: metrics
      port: 9091
      targetPort: metrics
