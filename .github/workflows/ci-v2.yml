name: ci-v2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-v2-${{ github.ref }}
  cancel-in-progress: true

permissions: read

env:
  APP_DIR: project/v2/cmd

jobs:
  # Linting and Vetting
  # Unit tests
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.APP_DIR}}/go.mod
          cache-dependency-path: ${{ env.APP_DIR}}/go.sum

      - name: Unit testing
        working-directory: ${{ env.APP_DIR }}
        run: go test ./... -count=1 -p=1

  # Integration Tests
  # Build Image
  # Publish artifact