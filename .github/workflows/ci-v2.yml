name: ci-v2

on:
  push:
    branches:
      - main

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/v2/cmd
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: project/v2/cmd/go.mod
          cache: true
          cache-dependency-path: project/v2/cmd/go.sum
      
      - name: run unit tests
        run: go test ./... -count=1 -p=1
